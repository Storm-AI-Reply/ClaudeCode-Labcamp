<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Join {{ quiz.title }}</title>
</head>
<body>
  <h1>Join {{ quiz.title }}</h1>
  <p>Scan the QR code or visit this page on your phone.</p>
  <form method="post" action="/quizzes/{{ quiz.id }}/join">
    <label>Your name: <input name="player_name"></label>
    <button type="submit">Join</button>
  </form>
</body>
</html>
